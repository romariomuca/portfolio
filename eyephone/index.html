<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An iPhone for Özge — Romario Muça</title>
<meta name="theme-color" content="#F4B6EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Switzer';font-weight:400;font-display:swap;src:url('fonts/switzer-latin-400-normal.woff2') format('woff2')}
  @font-face{font-family:'Switzer';font-weight:500;font-display:swap;src:url('fonts/switzer-latin-500-normal.woff2') format('woff2')}
  @font-face{font-family:'Switzer';font-weight:600;font-display:swap;src:url('fonts/switzer-latin-600-normal.woff2') format('woff2')}
  :root{
    --bg:#F4B6EA;--fg:#3A0D63;--acc:#FF5B2E;
    --cream:#ECE9E2;--cream2:#E2DED5;--ink:#0E0E0E;--txt:#EDEBE6;--dim:#77736C;
    --font:'Switzer',"Helvetica Neue",Arial,sans-serif;--mono:'Space Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;transition:background .7s ease,color .7s ease}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

  /* ── PAGE CORNERS ── */
  .corner{position:fixed;z-index:20;font-size:15px;line-height:1.2}
  .tl{top:10px;left:10px}
  .br{right:10px;bottom:14px}.tl .g{opacity:.55;display:block}
  .tr{top:10px;right:10px;display:flex;gap:18px;align-items:center}
  .tr a:hover,.snd:hover{opacity:.6}
  .snd{display:flex;align-items:center;gap:6px}
  .snd::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .snd[aria-pressed="false"]::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}

  /* ── INTRO: EYES ── */
  #face{position:fixed;inset:0;z-index:1;transition:opacity .6s ease,transform 1.1s cubic-bezier(.7,0,.2,1)}
  #face svg{width:100%;height:100%;display:block}
  .eye-white{fill:#fff}
  .lid{fill:none;stroke:var(--fg);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .7s}
  .iris{fill:var(--fg);transition:fill .7s}
  .blinker{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
  @keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.06)}}
  #band{fill:none;stroke:var(--fg);stroke-width:16;stroke-linecap:round;opacity:.92;transition:stroke .7s}
  .intro-copy{position:fixed;left:10px;right:10px;bottom:14px;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;transition:opacity .4s ease .35s,transform .6s ease .35s}
  body.in .intro-copy{opacity:1}
  #enter,.help{display:none!important}
  .intro-copy h1{font-weight:600;font-size:clamp(28px,3.7vw,62px);line-height:.98;letter-spacing:-.045em;max-width:13ch}
  .intro-copy h1 .soft{opacity:.5;font-weight:500}
  .cta,.toeyes{white-space:nowrap;font-size:17px;line-height:1;height:48px;min-width:230px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid currentColor;padding:0 22px;border-radius:99px;transition:background .25s,color .25s}
  .cta:hover{background:var(--fg);color:var(--bg)}

  /* ── DEVICE ── */
  #dev{position:fixed;left:0;top:0;width:360px;height:770px;z-index:10;transform-origin:center;transition:transform 1.15s cubic-bezier(.7,0,.2,1);user-select:none;-webkit-user-select:none}
  body:not(.in) #dev{cursor:pointer}
  .shell{position:absolute;inset:0;border-radius:36px;background:linear-gradient(155deg,#F4F2EC 0%,var(--cream) 40%,var(--cream2) 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(0,0,0,.06),inset -14px 0 0 -2px rgba(0,0,0,.025),0 1px 0 #cfcac0,0 30px 60px -18px rgba(40,20,40,.45),0 8px 18px -6px rgba(40,20,40,.25)}
  .rail{position:absolute;right:-2px;top:130px;bottom:60px;width:12px;border-radius:0 8px 8px 0;background:linear-gradient(90deg,#b9b9b6,#ececea 35%,#c9c9c6 60%,#a8a8a4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .screw{position:absolute;right:1px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f5f5f3,#9d9d99);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
  .lbl{position:absolute;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:#8C877E;text-transform:uppercase;white-space:nowrap}
  .jack{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#111 45%,#555 60%,#c9c5bc 70%);top:22px}

  .hang{position:absolute;left:0;top:-1952px;width:360px;height:2000px;z-index:-1;pointer-events:none;overflow:visible;filter:drop-shadow(2px 6px 6px rgba(40,20,40,.18))}
  .iword{white-space:nowrap;cursor:default}
  .ich{position:relative;display:inline-block}
  .ich .il{display:inline-block;transition:opacity .2s,transform .3s}
  .ich svg{position:absolute;left:50%;top:56%;pointer-events:none;width:.74em;height:.5em;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1);overflow:visible}
  .iword:hover .il,.iword.on .il{opacity:0;transform:scaleY(.2)}
  .iword:hover .ich svg,.iword.on .ich svg{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .ich svg .lidi{fill:#fff;stroke:currentColor;stroke-width:9;stroke-linejoin:round}
  .ich svg .iri{fill:currentColor}
  /* sound switch */
  .sw{position:absolute;left:30px;top:44px;width:40px;height:18px;border-radius:9px;background:#D6D1C7;box-shadow:inset 0 1px 2px rgba(0,0,0,.18);cursor:pointer}
  .sw i{position:absolute;top:2px;left:2px;width:20px;height:14px;border-radius:7px;background:linear-gradient(#fff,#e7e3da);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .18s cubic-bezier(.5,1.6,.5,1)}
  .sw.on i{left:18px}
  .sw b{position:absolute;right:-12px;top:5px;width:6px;height:6px;border-radius:50%;background:#bbb;transition:background .2s,box-shadow .2s}
  .sw.on b{background:var(--acc);box-shadow:0 0 6px var(--acc)}

  /* theme dial */
  .dial{position:absolute;right:-26px;top:26px;width:62px;height:62px;border-radius:50%;cursor:pointer;
    background:repeating-conic-gradient(#d9d9d6 0 4deg,#a9a9a5 4deg 8deg);box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
  .dial::after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fafaf8,#cfcfcb 70%,#b7b7b3);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .dial i{position:absolute;left:50%;top:13px;width:3px;height:12px;margin-left:-1.5px;border-radius:2px;background:#555;z-index:2}
  .led{position:absolute;right:46px;top:52px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);transition:background .4s,box-shadow .4s}

  /* screen */
  .bezel{position:absolute;left:16px;right:16px;top:60px;height:696px;border-radius:24px;background:#151515;box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.8)}
  .scr{position:absolute;left:22px;right:22px;top:22px;height:684px;border-radius:15px;background:var(--ink);color:var(--txt);overflow:hidden}
  .scr::after{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;z-index:6;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,0) 35%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
  .status{position:absolute;top:0;left:0;right:0;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#9A968E;z-index:4;background:linear-gradient(var(--ink) 70%,rgba(14,14,14,0))}
  .status .acc{color:var(--acc)}
  .status.sb{height:40px;padding:4px 26px 0 30px;font-family:Poppins,var(--font);font-size:13px;font-weight:600;letter-spacing:0;color:var(--txt)}
  .bat{width:21px;height:10px;border-radius:3px;border:1.3px solid currentColor;padding:1px;display:inline-block;position:relative}
  .bat i{display:block;width:75%;height:100%;background:currentColor;border-radius:1px}
  .bat::after{content:'';position:absolute;right:-3.5px;top:2.5px;width:1.5px;height:3.5px;background:currentColor;border-radius:0 1px 1px 0}
  #view{position:absolute;inset:40px 0 0 0;overflow:hidden}
  .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;scroll-behavior:smooth;padding-bottom:26px}
  .scroll::-webkit-scrollbar{display:none}
  .hintbar{position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#6E6A63;background:linear-gradient(rgba(14,14,14,0),var(--ink) 55%);z-index:4;pointer-events:none}
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:7;background:var(--acc);color:#111;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

  /* screen content */
  .vt{padding:8px 14px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--acc)}
  .list{list-style:none;padding:0 6px}
  .list li{display:flex;align-items:center;gap:10px;padding:0 8px;height:40px;font-size:16px;letter-spacing:-.02em;cursor:pointer;border-radius:9px}
  .list li .n{font-family:var(--mono);font-size:10px;color:#6E6A63;width:16px}
  .list li .sw2{width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .list li small{margin-left:auto;font-family:var(--mono);font-size:9px;color:#6E6A63;letter-spacing:.1em}
  .list li.sel{background:var(--acc);color:#111}
  .list li.sel .n,.list li.sel small{color:rgba(0,0,0,.55)}

  .lock{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 18px 18px}
  .lock .time{font-family:var(--mono);font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--txt)}
  .lock .date{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#7D7970;margin-top:6px;text-transform:uppercase}
  .lock .hi{margin-top:30px;font-size:24px;font-weight:600;letter-spacing:-.035em}
  .notif{margin-top:12px;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:#1D1D1D;border-radius:10px;padding:8px 11px;font-size:13px;animation:pop 1.8s ease-in-out infinite}
  .notif i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
  @keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .msg{padding:8px 14px 20px}
  .from{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#7D7970;margin-bottom:8px}
  .bubble{background:#1D1D1D;border-radius:14px 14px 14px 4px;padding:11px 13px;font-size:14.5px;line-height:1.3;margin-bottom:7px}
  .bubble.p{background:var(--acc);color:#111}
  .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:#7D7970;margin-top:10px;line-height:1.5}

  .proj{padding:4px 10px 0;position:relative}
  .proj img.hero{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#222;border-radius:10px}
  .dots{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:2}
  .dots i{width:14px;height:2px;border-radius:2px;background:rgba(255,255,255,.45)}
  .dots i.on{background:#fff}
  .tilehero{border-radius:10px;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
  .tilehero b{font-size:32px;font-weight:600;letter-spacing:-.045em;line-height:.95}
  .tilehero span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;opacity:.75;margin-top:8px;line-height:1.4}
  .ptxt{padding:14px 14px 14px}
  .pn{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--acc)}
  .ptxt h3{font-weight:600;font-size:24px;letter-spacing:-.04em;line-height:1}
  .ptxt .tag{font-size:14.5px;margin-top:4px;line-height:1.2;color:#CFCBC3}
  .ptxt .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--acc);margin-top:8px;text-transform:uppercase}
  .ptx{font-size:13.5px;line-height:1.32;margin-top:10px;color:#BDB9B1}
  .gal{display:flex;flex-direction:column;gap:8px;padding:4px 10px 6px}
  .gimg.app{border-radius:16px;box-shadow:0 0 0 1px #2a2a2a;cursor:default}
  .chap{padding:20px 4px 4px;border-top:1px solid #262626;margin-top:8px}
  .chap span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--acc)}
  .chap h4{font-size:22px;font-weight:600;letter-spacing:-.045em;line-height:1;margin-top:6px}
  .chap small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#8A867E;margin-top:5px;text-transform:uppercase;line-height:1.4}
  .chap p{font-size:13.5px;line-height:1.32;color:#BDB9B1;margin-top:8px}
  .gimg{width:100%;height:auto;display:block;background:#222;cursor:zoom-in;border-radius:10px}
  video.gimg{cursor:default}
  .pend{padding:8px 14px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .pend .g{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#6E6A63}
  .open{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;background:var(--txt);color:#111;padding:8px 12px;border-radius:99px;text-transform:uppercase}
  .open.acc{background:var(--acc)}

  .home{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10px 0 30px}
  .hi{padding:8px 14px 0;display:flex;flex-direction:column;gap:4px}
  .hi span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--acc)}
  .hi b{font-size:30px;font-weight:600;letter-spacing:-.045em;line-height:1;margin-top:6px}
  .hi em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#7D7970;text-transform:uppercase}
  .list.big li{height:52px;font-size:22px;font-weight:600;letter-spacing:-.04em}
  .wcards{display:flex;flex-direction:column;gap:14px;padding:0 10px 10px}
  .wc{cursor:pointer;border-radius:12px;padding:6px;transition:background .15s}
  .wc.sel{background:#1D1D1D;box-shadow:inset 0 0 0 1.5px var(--acc)}
  .wimg{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .wimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .wimg i{position:absolute;top:8px;left:8px;font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;background:rgba(14,14,14,.75);color:#fff;padding:3px 6px;border-radius:5px}
  .wtx{padding:9px 4px 2px;display:flex;flex-direction:column;gap:2px}
  .wtx b{font-size:20px;font-weight:600;letter-spacing:-.04em;line-height:1.05}
  .wtx span{font-size:13px;color:#BDB9B1}
  .wtx small{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--acc);text-transform:uppercase;margin-top:3px}
  .calling{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 14px 18px}
  .calling .ring{width:86px;height:86px;border-radius:50%;background:var(--acc);position:relative;padding:4px}
  .calling .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:62% 40%;display:block;position:relative;z-index:1}
  .calling h3{margin-top:22px;font-size:22px;font-weight:600;letter-spacing:-.035em}
  .calling .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#7D7970;margin-top:5px}
  .contact{padding:0 14px 20px;display:flex;flex-direction:column}
  .contact img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:62% 40%;background:#222}
  .contact>b{font-size:24px;font-weight:600;letter-spacing:-.04em;margin-top:12px}
  .contact>em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#7D7970;text-transform:uppercase;margin:2px 0 14px}
  .contact a{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid #262626;font-size:15px;letter-spacing:-.02em}
  .contact a small{grid-column:1/-1;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--acc)}
  .contact a i{font-style:normal;color:#7D7970;grid-row:2;grid-column:2}
  .contact a:hover i{color:var(--acc)}
  .cs{padding:16px 14px 6px;border-top:1px solid #262626}
  .lb{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--acc);margin-bottom:8px}
  .cs p.big{font-size:17px;line-height:1.25;letter-spacing:-.02em}
  .dec{margin:4px 0 16px}
  .dh{display:flex;align-items:baseline;gap:8px}
  .dh i{font-style:normal;font-family:var(--mono);font-size:10px;color:#6E6A63}
  .dh b{font-size:17px;font-weight:600;letter-spacing:-.03em}
  .dec p{font-size:13px;line-height:1.3;color:#BDB9B1;margin:3px 0 8px 22px}
  .slot{aspect-ratio:4/3;border:1.5px dashed #3A3A3A;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#8A867E}
  .slot span{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:#5A5650}
  .slot.tall,.gimg.tall{aspect-ratio:9/16;object-fit:cover}
  .ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ba small,.also small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:#8A867E;margin-bottom:5px}
  .also{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .also img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;margin-bottom:5px}
  .pin{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px 22px 26px}
  .ptop{text-align:center}
  .ptime{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .pmsg{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#BDB9B1;margin-top:26px}
  .pdots{display:flex;justify-content:center;gap:14px;margin-top:18px}
  .pdots i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #BDB9B1;transition:background .12s}
  .pdots i.on{background:var(--txt);box-shadow:none}
  .pdots.err{animation:shake .38s}
  .pdots.ok i{background:#2FB86B;box-shadow:none}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;justify-items:center}
  .pk{width:58px;height:58px;border-radius:50%;background:#232323;font-size:22px;font-weight:500;color:var(--txt);transition:background .1s,transform .08s}
  .pk:active{background:#3a3a3a;transform:scale(.95)}
  .pk.pkc{background:none;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;line-height:1.3;color:#2FB86B}
  .pk.pkt{background:none;font-size:20px;color:#8A867E}
  .phint{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:#6E6A63;text-align:center}
  .intro{padding:22px 20px 12px!important;display:flex;flex-direction:column;gap:12px}
  .ihi{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--acc)}
  .intro h2{font-size:25px;font-weight:600;letter-spacing:-.045em;line-height:1.02;margin-top:4px}
  .intro p{font-size:12.8px;line-height:1.36;color:#C9C5BD}
  .intro p b{color:var(--txt);font-weight:600}

function sfx(kind,i){

    case 'tick':noise({dur:.018,vol:.09,hp:3500});tone({f:2400,dur:.025,vol:.02,type:'square'});break;
    case 'ok':noise({dur:.015,vol:.07});tone({f:660,f2:1320,dur:.09,vol:.06,type:'triangle'});break;
    case 'back':noise({dur:.015,vol:.07});tone({f:880,f2:440,dur:.09,vol:.06,type:'triangle'});break;
    case 'menu':noise({dur:.015,vol:.07});tone({f:784,dur:.05,vol:.05,type:'triangle'});tone({f:1047,dur:.07,vol:.05,type:'triangle',when:.06});break;
    case 'key':noise({dur:.02,vol:.08,hp:1500});tone({f:NOTES[i]*1.0,f2:NOTES[i]*.995,dur:.22,vol:.07,type:'triangle'});tone({f:NOTES[i]*2,dur:.12,vol:.02,type:'sine'});break;
    case 'pill':noise({dur:.02,vol:.07,hp:2500});tone({f:1175,dur:.06,vol:.04,type:'square'});break;
    case 'call':tone({f:880,dur:.07,vol:.045});tone({f:1320,dur:.11,vol:.045,when:.08});break;
    case 'dial':for(let k=0;k<5;k++){noise({dur:.012,vol:.11,hp:4000,when:k*.035});tone({f:3200,dur:.012,vol:.015,type:'square',when:k*.035})}tone({f:523,f2:784,dur:.18,vol:.035,type:'triangle',when:.19});break;
    case 'switch':noise({dur:.03,vol:.12,hp:800});tone({f:140,f2:90,dur:.05,vol:.08,type:'sine'});break;
    case 'boot':[523,659,784,1047].forEach((f,k)=>tone({f,dur:.14,vol:.04,type:'triangle',when:k*.08}));break;
  }
}
function haptic(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function press(el){if(!el)return;el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),110)}

function setSound(on,quiet){
  soundOn=on;$('snd').setAttribute('aria-pressed',on);$('snd').textContent=on?'Sound on':'Sound off';
  $('sw').classList.toggle('on',on);
  try{localStorage.setItem('rmSound',on?'on':'off')}catch(e){}

}

function applyTheme(i,announce){
  const t=THEMES[i],r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--fg',t.fg);r.setProperty('--acc',t.acc);
  document.querySelector('meta[name=theme-color]').setAttribute('content',t.bg);
  try{localStorage.setItem('rmTheme',i)}catch(e){}
  if(announce)toast('THEME · '+t.name);
}

function pinPress(k){
  if(k==='call'){sfx('call');haptic([10,40,10]);jump('call',['pin']);return}
  if(k==='del'){sfx('back');pinBuf=pinBuf.slice(0,-1);render();return}
  if(pinBuf.length>=4)return;
  sfx('tick');haptic(8);pinBuf+=k;render();
  if(pinBuf.length===4){
    const d=$('pdots');
    if(pinBuf===PIN){d.classList.add('ok');sfx('boot');haptic([10,30,10]);setTimeout(()=>{unlocked=true;try{localStorage.setItem('rmUnlocked','1')}catch(e){}pinBuf='';jump('menu',[]);toast('UNLOCKED')},450)}
    else{d.classList.add('err');sfx('back');haptic([30,40,30]);setTimeout(()=>{pinBuf='';render()},420)}
  }
}

/* ═════════ INPUT ═════════ */
function key(k,el){
  if(!document.body.classList.contains('in'))enter();
  press(el);
  if(k==='restart'){sfx('back');haptic(12);closeApp();appVer=null;appf.removeAttribute('src');stack=[];state='intro';render();eyeTalk('FROM THE TOP');return}
  if(k==='old'||k==='new'||((k==='1'||k==='2')&&state!=='pin')){const v=(k==='old'||k==='1')?'old':'new';sfx('key',v==='old'?0:2);haptic(18);openApp(v);return}
  if(state==='app'){
    if(k==='back'||k==='menu'){sfx(k==='menu'?'menu':'back');haptic(10);state=unlocked?'menu':'pin';stack=[];render();return}
    if(k==='ok'){sfx('ok');haptic(10);openApp(appVer==='old'?'new':'old');return}
  }
  if(!unlocked){
    if(k==='6'&&state!=='pin'||k==='call'){sfx('call');haptic([10,40,10]);jump('call',['pin']);return}
    if(state==='call'&&k==='back'){sfx('back');back();return}
    if(state==='pin'&&/^[0-9]$/.test(k)){pinPress(k);return}
    if(state==='pin'&&k==='back'){pinPress('del');return}
    locked();return}
  if(k==='up'||k==='down'){sfx('tick');haptic(6);move(k==='up'?-1:1);return}
  if(k==='ok'){sfx('ok');haptic(14);openSel();return}
  if(k==='back'){sfx('back');haptic(10);back();return}
  if(k==='menu'){sfx('menu');haptic(10);jump('menu',[]);return}
  if(/^[1-3]$/.test(k)){const i=+k-1;sfx('key',i);haptic(18);proj=i;jump('proj',['menu','works']);toast(String(k).padStart(2,'0')+' · '+WORKS[i].name.toUpperCase());return}
  if(k==='4'){sfx('pill');haptic(10);jump('why',['menu']);return}
  if(k==='5'){sfx('pill');haptic(10);jump('about',['menu']);return}
  if(k==='6'||k==='call'){sfx('call');haptic([10,40,10]);jump('call',['menu']);return}
  if(k==='0'){sfx('menu');jump('menu',[]);return}
  if(k==='*'){sfx('back');jump('menu',[]);return}
  if(k==='#'){sfx('pill');jump('works',['menu']);return}
}
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();key(b.dataset.k,b)}));

 {n:'classic',shape:'M-54 0 Q0 -42 54 0 Q0 42 -54 0Z',fill:'#fff',line:'#111',iris:'<circle r="19" fill="#3A0D63"/><circle r="8" fill="#0B0B0B"/><circle cx="6" cy="-7" r="4" fill="#fff"/>'},
 {n:'cat',shape:'M-56 0 Q0 -40 56 0 Q0 40 -56 0Z',fill:'#FFD23F',line:'#111',iris:'<ellipse rx="5" ry="24" fill="#111"/><circle cx="7" cy="-9" r="3" fill="#fff"/>'},
 {n:'pixel',shape:'M-48 -14 H-30 V-26 H30 V-14 H48 V14 H30 V26 H-30 V14 H-48Z',fill:'#fff',line:'#111',iris:'<rect x="-15" y="-15" width="30" height="30" fill="#2FB86B"/><rect x="-7" y="-7" width="14" height="14" fill="#111"/><rect x="3" y="-13" width="7" height="7" fill="#fff"/>'},
 {n:'hypno',shape:'M-54 0 Q0 -42 54 0 Q0 42 -54 0Z',fill:'#fff',line:'#111',iris:'<circle r="21" fill="#fff" stroke="#111" stroke-width="3"/><circle r="14" fill="none" stroke="#111" stroke-width="3"/><circle r="7" fill="none" stroke="#111" stroke-width="3"/><circle r="2" fill="#111"/>'},
 {n:'heart',shape:'M-54 0 Q0 -42 54 0 Q0 42 -54 0Z',fill:'#fff',line:'#111',iris:'<circle r="19" fill="#F4B6EA"/><path d="M0 10 C-14 0 -12 -12 -5 -12 C-2 -12 0 -9 0 -7 C0 -9 2 -12 5 -12 C12 -12 14 0 0 10Z" fill="#E5484D"/>'},
 {n:'rainbow',shape:'M-54 0 Q0 -42 54 0 Q0 42 -54 0Z',fill:'#fff',line:'#111',iris:'<circle r="20" fill="#FF5A5F"/><circle r="16.5" fill="#FECA57"/><circle r="13" fill="#1DD1A1"/><circle r="9.5" fill="#54A0FF"/><circle r="6" fill="#111"/><circle cx="6" cy="-7" r="3.5" fill="#fff"/>'},
 {n:'radar',shape:'M-54 0 Q0 -42 54 0 Q0 42 -54 0Z',fill:'#fff',line:'#111',iris:'<circle r="20" fill="#C81E2B"/><circle r="20" fill="none" stroke="#5A0A12" stroke-width="2"/><g><path d="M0 0 L0 -19" stroke="#FFD0D3" stroke-width="2.5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/></g><circle r="6" fill="#1A0306"/><circle cx="6" cy="-8" r="3" fill="#fff"/>'},
 {n:'galaxy',shape:'M-56 0 Q0 -34 56 0 Q0 34 -56 0Z',fill:'#fff',line:'#111',iris:'<circle r="20" fill="#B8A4F5"/><circle r="13" fill="#7B5CF5"/><circle r="6" fill="#2A1660"/><path d="M-11 -9l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#fff"/><path d="M10 6l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9z" fill="#fff"/><circle cx="12" cy="-10" r="1.6" fill="#fff"/>'},
 {n:'star',shape:'M-54 0 Q0 -42 54 0 Q0 42 -54 0Z',fill:'#fff',line:'#111',iris:'<circle r="19" fill="#FF5B2E"/><path d="M0-11 3 -3 11 -3 5 2 7 10 0 5 -7 10 -5 2 -11 -3 -3 -3Z" fill="#fff"/>'},
 {n:'wink',shape:'M-54 0 Q0 -42 54 0 Q0 42 -54 0Z',fill:'#fff',line:'#111',iris:'<circle r="19" fill="#5B8DEF"/><circle r="8" fill="#0B0B0B"/><circle cx="6" cy="-7" r="4" fill="#fff"/>',over:'<path d="M-40 -22 l-8 -10M-14 -30 l-3 -12M14 -30 l3 -12M40 -22 l8 -10" stroke="#111" stroke-width="5" stroke-linecap="round"/>'}
];
let eyeI=0;const ep=$('eyeport'),epIris=$('epIris');
function drawEye(i){const e=EYES[i];['epShape','epShapeC','epLine'].forEach(id=>$(id).setAttribute('d',e.shape));$('epShape').setAttribute('fill',e.fill);$('epLine').setAttribute('stroke',e.line);epIris.innerHTML=e.iris;$('epOver').innerHTML=e.over||''}
function blink(change=true){ep.classList.add('shut');setTimeout(()=>{if(change){eyeI=(eyeI+1)%EYES.length;drawEye(eyeI)}ep.classList.remove('shut')},110)}
let blinkT;function loopBlink(){clearTimeout(blinkT);blinkT=setTimeout(()=>{blink();loopBlink()},2600+Math.random()*2400)}
function look(x,y){const r=ep.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/320);epIris.setAttribute('transform',`translate(${dx/d*22*k} ${dy/d*10*k})`)}
addEventListener('pointermove',e=>look(e.clientX,e.clientY),{passive:true});
addEventListener('touchmove',e=>{if(e.touches[0])look(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
ep.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();sfx('tick');haptic(8);blink();loopBlink()});
addEventListener('pointerdown',e=>{if(!MOB||e.target.closest('#eyeport'))return;look(e.clientX,e.clientY);blink();loopBlink()},{capture:true,passive:true});
drawEye(0);loopBlink();
addEventListener('mousemove',e=>{const mi=$('miniIris');if(mi){const rr=mi.ownerSVGElement.getBoundingClientRect(),mx=e.clientX-(rr.left+rr.width/2),my=e.clientY-(rr.top+rr.height/2),md=Math.hypot(mx,my)||1,mk=Math.min(1,md/300);mi.setAttribute('transform',`translate(${mx/md*26*mk} ${my/md*12*mk})`)}},{passive:true});

function enter(){if(document.body.classList.contains('in'))return;document.body.classList.add('in');place();sfx('boot');haptic([8,40,8])}
function exitIntro(){document.body.classList.remove('in');place()}
$('enter').addEventListener('click',enter);
$('iword').addEventListener('click',e=>{e.currentTarget.classList.toggle('on');sfx('tick')});
dev.addEventListener('click',()=>{if(!document.body.classList.contains('in'))enter()});
$('toIntro').addEventListener('click',e=>{e.preventDefault();exitIntro()});
document.addEventListener('pointerdown',e=>{return;if(!document.body.classList.contains('in'))return;if($('zoom').classList.contains('on'))return;if(e.target.closest('#dev,.corner,.help,#zoom'))return;exitIntro();sfx('back')});
setInterval(()=>{$('clk').textContent=clock()},20000);

let MOB=false;
function updateMode(){
  document.body.classList.add('in');
  const m=innerWidth<=760;
  if(m===MOB&&document.body.classList.contains('mob')===m)return;
  MOB=m;document.body.classList.toggle('mob',m);
  document.body.classList.add('in');
  dev.style.transition='none';place();requestAnimationFrame(()=>requestAnimationFrame(()=>dev.style.transition=''));
}
addEventListener('resize',updateMode);
updateMode();
applyTheme(themeI);setSound(soundOn,true);render();
dev.style.transition='none';place();requestAnimationFrame(()=>requestAnimationFrame(()=>dev.style.transition=''));
document.fonts&&document.fonts.ready.then(place);
</script>
</body>
